<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#173d61"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b09b"/>
      <stop offset="100%" stop-color="#96c93d"/>
    </linearGradient>

    <linearGradient id="container-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #64ffda; letter-spacing: 1px; }
    .tagline { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 15px; fill: #8892b0; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #ffffff; }
    
    /* Dynamic Animations */
    @keyframes pulse-wave {
      0% { stroke-dashoffset: 1000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    @keyframes float-ship {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(0.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes ping-node {
      0% { r: 4px; opacity: 0.9; }
      50% { r: 12px; opacity: 0.3; }
      100% { r: 4px; opacity: 0.9; }
    }
    @keyframes scan-line {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .animated-route { stroke-dasharray: 12, 8; animation: pulse-wave 30s linear infinite; }
    .floating-ship { animation: float-ship 6s ease-in-out infinite; }
    .pinging-dot { animation: ping-node 3s ease-in-out infinite; }
    .scanner { animation: scan-line 8s linear infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- World Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- DYNAMIC BACKGROUND GRAPHICS (Ocean Routes & Signal Nodes) -->
  <g opacity="0.4">
    <!-- Curved Shipping Lanes -->
    <path d="M -50,280 Q 250,120 550,230 T 1150,140" fill="none" stroke="url(#cyan-glow)" stroke-width="3" class="animated-route" />
    <path d="M 100,340 Q 450,180 800,290 T 1250,100" fill="none" stroke="url(#orange-glow)" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- AIS Radar Pulse Rings in Background -->
    <circle cx="1020" cy="140" r="80" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2" />
    <circle cx="1020" cy="140" r="130" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.1" />
    <circle cx="1020" cy="140" r="180" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.05" />
    <circle cx="1020" cy="140" r="4" fill="#00f2fe" class="pinging-dot" />
  </g>

  <!-- CONTAINER SHIP & CARGO GRAPHIC (Right Decorative Side) -->
  <g class="floating-ship" filter="url(#shadow)">
    <!-- Vessel Hull -->
    <path d="M 880,230 L 1120,230 L 1080,265 Q 1060,275 920,275 L 860,250 Z" fill="url(#container-grad)" stroke="#4facfe" stroke-width="1.5" />
    
    <!-- Container Stacks on Ship -->
    <!-- Layer 1 -->
    <rect x="895" y="200" width="35" height="28" rx="2" fill="#ff0844" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    <rect x="933" y="200" width="35" height="28" rx="2" fill="#00b09b" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    <rect x="971" y="200" width="35" height="28" rx="2" fill="#f6d365" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    <rect x="1009" y="200" width="35" height="28" rx="2" fill="#4facfe" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Layer 2 -->
    <rect x="914" y="170" width="35" height="28" rx="2" fill="#00f2fe" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    <rect x="952" y="170" width="35" height="28" rx="2" fill="#ff0844" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    <rect x="990" y="170" width="35" height="28" rx="2" fill="#00b09b" opacity="0.9" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Bridge / Control Tower -->
    <rect x="1048" y="160" width="28" height="68" rx="3" fill="#ffffff" opacity="0.95" />
    <rect x="1052" y="168" width="20" height="8" rx="1" fill="#0a192f" />
    <line x1="1062" y1="160" x2="1062" y2="145" stroke="#ffffff" stroke-width="2" />
    <circle cx="1062" cy="143" r="3" fill="#ff0844" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unobscured Text & Badges) -->
  <g transform="translate(60, 0)">
    
    <!-- Category Tag Header Pill -->
    <g transform="translate(0, 52)">
      <rect width="320" height="30" rx="15" fill="#173d61" stroke="#4facfe" stroke-width="1.5" />
      <circle cx="16" cy="15" r="5" fill="#00f2fe" />
      <text x="32" y="20" class="badge-text" fill="#64ffda">OCEAN FREIGHT &amp; LOGISTICS VISIBILITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title" filter="url(#shadow)">Awesome Container Tracking 🚢</text>
    
    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Curated SaaS Platforms, DCSA Standards &amp; Open-Source AIS Ecosystem</text>
    
    <!-- Tagline Description -->
    <text x="0" y="208" class="tagline">Real-time ocean milestone tracking, vessel AIS decoders, terminal ICD software, and AI MCP servers.</text>

    <!-- Tech Feature Pills / Badges -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: SaaS APIs -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#1e3c72" stroke="#4facfe" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">⚡ 10+ SaaS APIs</text>
      </g>
      
      <!-- Pill 2: Open Source AIS -->
      <g transform="translate(147, 0)">
        <rect width="165" height="34" rx="8" fill="#1e3c72" stroke="#00b09b" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">🛰️ AIS &amp; SDR Decoders</text>
      </g>

      <!-- Pill 3: AI & DCSA -->
      <g transform="translate(324, 0)">
        <rect width="155" height="34" rx="8" fill="#1e3c72" stroke="#ff0844" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">🤖 DCSA &amp; MCP AI</text>
      </g>

      <!-- Pill 4: ICD Logistics -->
      <g transform="translate(491, 0)">
        <rect width="165" height="34" rx="8" fill="#1e3c72" stroke="#f6d365" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">📦 Depot &amp; Yard Systems</text>
      </g>
    </g>
  </g>
</svg>
